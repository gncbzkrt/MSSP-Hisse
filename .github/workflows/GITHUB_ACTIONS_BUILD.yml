name: MSSP PERSONAL APK Build

on:
  workflow_dispatch:
  push:
    paths:
      - '**/*.zip'
      - '.github/workflows/**'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Kaynak depoyu al
        uses: actions/checkout@v4

      - name: Java 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK kur
        uses: android-actions/setup-android@v3

      - name: Android 35 paketlerini kur
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Gradle kur
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: MSSP Android kaynagini hazirla
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "MSSP KAYNAK ARANIYOR"
          echo "======================================"

          SOURCE_ZIP=$(find . -maxdepth 3 -type f \
            -iname "MSSP_ANDROID_SOURCE*.zip" \
            -o -iname "*ANDROID*SOURCE*.zip" \
            | head -n 1)

          if [ -z "$SOURCE_ZIP" ]; then
            echo "HATA: Android kaynak ZIP bulunamadi."
            find . -maxdepth 3 -type f | sort
            exit 1
          fi

          echo "Kaynak ZIP:"
          echo "$SOURCE_ZIP"

          rm -rf extracted android
          mkdir -p extracted android

          unzip -q "$SOURCE_ZIP" -d extracted

          echo
          echo "ZIP acildi. Proje koku araniyor..."

          SETTINGS_FILE=$(find extracted -type f \
            -name "settings.gradle.kts" -o -name "settings.gradle" \
            | head -n 1)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "HATA: settings.gradle veya settings.gradle.kts bulunamadi."
            find extracted -maxdepth 4 -type f | sort
            exit 1
          fi

          PROJECT_ROOT=$(dirname "$SETTINGS_FILE")

          echo "Android proje koku bulundu:"
          echo "$PROJECT_ROOT"

          cp -R "$PROJECT_ROOT"/. android/

          echo
          echo "======================================"
          echo "ANDROID PROJE KONTROLU"
          echo "======================================"

          ls -la android

          if [ ! -f "android/settings.gradle.kts" ] && \
             [ ! -f "android/settings.gradle" ]; then
            echo "HATA: Proje koku duzeltilemedi."
            exit 1
          fi

          if [ ! -f "android/app/build.gradle.kts" ] && \
             [ ! -f "android/app/build.gradle" ]; then
            echo "HATA: app Gradle dosyasi bulunamadi."
            exit 1
          fi

          echo
          echo "Android proje yapisi DOGRU."

      - name: Imzali Release APK derle
        working-directory: android
        shell: bash
        run: |
          set -e
          gradle --no-daemon assembleRelease

      - name: APK dosyasini bul
        shell: bash
        run: |
          set -e

          APK=$(find android/app/build/outputs/apk/release \
            -type f -name "*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "HATA: Release APK bulunamadi."
            find android/app/build/outputs -type f || true
            exit 1
          fi

          echo "APK bulundu:"
          echo "$APK"

          cp "$APK" MSSP_PERSONAL.apk

      - name: APK
